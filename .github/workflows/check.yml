name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-checks:
    name: Host tests and distribution checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Run checks
        run: ./tools/test.sh
  firmware-builds:
    name: Build stock Cornix pair
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libclang-dev gcc-arm-none-eabi libnewlib-arm-none-eabi
          rustup toolchain install 1.95.0 --profile minimal --target thumbv7em-none-eabihf --component llvm-tools-preview
          cargo +1.95.0 install flip-link --version 0.1.12 --locked
      - name: Build stock applications
        run: ./build.sh all
      - name: Verify packaged firmware and unchanged configuration identity
        run: |
          python3 tools/package_stock.py --check
          python3 tools/verify_stock.py
          python3 tools/test_stock_cornix.py
